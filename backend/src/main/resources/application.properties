spring.application.name=portfolio-api
server.port=${PORT:8080}


resend.api-key=${RESEND_API_KEY:}
portfolio.contact.to=${CONTACT_TO_EMAIL:}
portfolio.contact.from=${CONTACT_FROM_EMAIL:Portfolio <onboarding@resend.dev>}

# Database
# Uses H2 as a safe local/fallback database. In production set DATABASE_URL,
# DATABASE_USERNAME and DATABASE_PASSWORD to PostgreSQL values.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
server.forward-headers-strategy=framework


portfolio.contact.rate-limit.max-requests=${CONTACT_RATE_LIMIT_MAX_REQUESTS:5}
portfolio.contact.rate-limit.window-minutes=${CONTACT_RATE_LIMIT_WINDOW_MINUTES:10}


# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Portfolio Java Backend API
info.app.version=1.0.0

management.health.mail.enabled=false
management.prometheus.metrics.export.enabled=true
